name: NixOS evaluation

on:
  push:
    paths:
      - flake.lock
      - flake.nix
      - '**/*.nix'
      - .github/workflows/nix-check.yml
  pull_request:
    paths:
      - flake.lock
      - flake.nix
      - '**/*.nix'
      - .github/workflows/nix-check.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate and dry-run both hosts
        shell: bash
        run: |
          failed=0
          for host in desktop-amd laptop-intel; do
            echo "::group::${host}"
            if nix eval --raw --show-trace --no-write-lock-file \
                ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" &&
               nix build --dry-run --no-link --show-trace --no-write-lock-file \
                ".#nixosConfigurations.${host}.config.system.build.toplevel"; then
              echo "${host}: evaluation и dry-run прошли" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "${host}: ошибка evaluation или dry-run" | tee -a "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
